<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Links Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f4f4f9;
            color: #333;
            position: relative; /* Needed for absolute positioning of time */
        }

        h1 {
            color: white; /* Text color of header */
            background-color: black; /* Header background color */
            text-align: center;
            padding: 20px;
            margin: 0;
        }

        .time {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 18px;
            color: white; /* Time text color */
            font-family: 'Arial', sans-serif;
        }

        .links {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px; /* To avoid overlap with header */
        }

        .link {
            margin: 10px;
            padding: 10px;
            text-decoration: none;
            font-size: 18px;
            color: #fff;
            background-color: #3498db;
            border-radius: 5px;
            width: 200px;
            text-align: center;
            transition: background-color 0.3s;
        }

        .link:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <h1>Welcome to My Links Page</h1>
    
    <!-- Time Display Section -->
    <div class="time" id="time"></div> 
    
    <div class="links">
        <a href="https://www.google.com" target="_blank" class="link">Google</a>
        <a href="https://www.facebook.com" target="_blank" class="link">Facebook</a>
        <a href="https://www.youtube.com" target="_blank" class="link">YouTube</a>
        <a href="https://www.twitter.com" target="_blank" class="link">Twitter</a>
        <a href="https://www.linkedin.com" target="_blank" class="link">LinkedIn</a>
    </div>

    <script>
        function updateTime() {
            const timeDisplay = document.getElementById('time');
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            const timeString = `${hours}:${minutes}:${seconds}`;
            timeDisplay.textContent = timeString;  // Only time without the label
        }

        setInterval(updateTime, 1000); // Update time every second
    </script>

</body>
</html>
